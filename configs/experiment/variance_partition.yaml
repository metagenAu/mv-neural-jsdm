# @package _global_
#
# Named experiment for deliverable #1: variance partitioning.
#
# Identical composition to ``soil_full_hierarchical`` -- it is the canonical
# entry point users invoke when they want to demonstrate the variance
# partitioning workflow:
#
#   python -m mvnjsdm.cli.train +experiment=variance_partition
#   python -m mvnjsdm.cli.analyse run_dir=outputs/<stamp> \
#       analyses=[variance_partition]
#
defaults:
  - /assay@model.assays.chem: continuous_gaussian
  - /assay@model.assays.indicators: binary_bernoulli
  - /feature_structure@model.feature_structures.chem: none
  - /feature_structure@model.feature_structures.indicators: none
  - override /data: soil_full
  - override /env@model.env: small
  - override /hierarchy@model.hierarchy: nested
  - override /feature_structure@model.feature_structures.assay_a: pagel_lambda
  - override /feature_structure@model.feature_structures.assay_b: pagel_lambda

model:
  shared_dim: 8
  private_dim: 4
  fusion: mopoe
