[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mvnjsdm"
version = "0.0.1"
description = "Multi-view neural joint species distribution model (domain-agnostic)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{ name = "mv-neural-jsdm contributors" }]

dependencies = [
  "torch>=2.2,<3",
  "pytorch-lightning>=2.2,<3",
  "hydra-core>=1.3,<2",
  "omegaconf>=2.3,<3",
  "pydantic>=2.5,<3",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "pyarrow>=14",
  "anndata>=0.10",
  "mudata>=0.2.3",
  "networkx>=3.2",
]

[project.optional-dependencies]
heavy = [
  "gpytorch>=1.11",
  "scvi-tools>=1.1",
  "ete3>=3.1.3",
]
dev = [
  "pytest>=7.4",
  "pytest-timeout>=2.2",
  "ruff>=0.4",
  "black>=24.3",
  "pre-commit>=3.6",
]

[project.scripts]
mvnjsdm-train = "mvnjsdm.cli.train:main"
mvnjsdm-export = "mvnjsdm.cli.export:main"
mvnjsdm-analyse = "mvnjsdm.cli.analyse:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mvnjsdm" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: marks tests as slow",
  "integration: integration tests that run end-to-end",
]
